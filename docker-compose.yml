services:
  openfishing:
    build: .
    image: openfishing
    container_name: openfishing
    restart: unless-stopped
    # Der Port 3000 muss nicht mehr nach außen freigegeben werden, 
    # da Caddy intern im Docker-Netzwerk darauf zugreift.
    expose:
      - "3000"
    volumes:
      - openfishing-db:/app/data
      - openfishing-uploads:/app/uploads
    environment:
      # Persistente SQLite-Datenbankdatei (im /app/data-Volume)
      - DATABASE_URL=/app/data/openfishing.db
      # Uploads-Verzeichnis (im /app/uploads-Volume)
      - UPLOAD_PATH=/app/uploads
      # Öffentliche URL — angepasst auf HTTPS für die Standortermittlung
      - BASE_URL=https://server.internal
      - ORIGIN=https://server.internal

  caddy:
    image: caddy:latest
    container_name: caddy_proxy
    restart: unless-stopped
    ports:
      - "80:80"   # Leitet HTTP-Anfragen automatisch auf HTTPS um
      - "443:443" # Der verschlüsselte HTTPS-Port
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - openfishing

volumes:
  openfishing-db:
  openfishing-uploads:
  caddy_data:
  caddy_config: